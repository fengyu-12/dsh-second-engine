<!doctype html>
<html lang="zh-CN" data-skin="codex" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第二引擎</title>
<script>
try {
  var s = localStorage.getItem('bridge_skin');
  document.documentElement.setAttribute('data-skin', s === 'claude' ? 'claude' : 'codex');
  var t = localStorage.getItem('bridge_theme');
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  var f = localStorage.getItem('bridge_font');
  if (f) document.documentElement.setAttribute('data-font', f);
  if (localStorage.getItem('bridge_compact') === '1') document.documentElement.setAttribute('data-compact', '1');
} catch (e) {}
</script>
<style>
  /* ═══ 主题变量层：Codex/Claude 皮 × 明暗，共 4 组（机制与原版一致） ═════ */
  :root {
    color-scheme: light;
    --bg: #f7f7f8; --panel: #ffffff; --panel2: #f1f2f4;
    --line: #e6e6ea; --line2: #d6d7dc;
    --fg: #1f2328; --dim: #5a6068; --muted: #8b909a;
    --accent: #2f6bdf; --err: #c0392d; --warn: #96690a; --ok: #1c7f42;
    --acc-weak: rgba(47,107,223,.13); --err-weak: rgba(192,57,45,.10);
    --warn-weak: rgba(150,105,10,.12); --ok-weak: rgba(28,127,66,.13);
    --bubble-me: #e9eefb; --code-bg: #f6f8fa;
    --input-bg: #ffffff; --btn-fg: #ffffff;
    --sel: #eef1f6; --hover: rgba(0,0,0,.035);
    --mask: rgba(18,21,26,.38);
    --shadow-1: 0 1px 2px rgba(20,24,31,.05);
    --shadow-2: 0 8px 28px rgba(20,24,31,.14);
    --gap: 18px; --pad-bubble: 10px 14px;
    --fs-body: 15px;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16171a; --panel: #1d1e22; --panel2: #25262b;
    --line: #2c2d33; --line2: #3a3b42;
    --fg: #e6e7ea; --dim: #9da0a8; --muted: #7d808a;
    --accent: #4c83ff; --err: #f47067; --warn: #e3b341; --ok: #57ab5a;
    --acc-weak: rgba(76,131,255,.22); --err-weak: rgba(244,112,103,.16);
    --warn-weak: rgba(227,179,65,.15); --ok-weak: rgba(87,171,90,.18);
    --bubble-me: #262b3a; --code-bg: #191a1e;
    --input-bg: #1d1e22; --btn-fg: #ffffff;
    --sel: #26272c; --hover: rgba(255,255,255,.045);
    --mask: rgba(0,0,0,.58);
    --shadow-1: 0 1px 2px rgba(0,0,0,.28);
    --shadow-2: 0 8px 28px rgba(0,0,0,.42);
  }
  html[data-skin="claude"] {
    color-scheme: light;
    --bg: #faf9f5; --panel: #ffffff; --panel2: #f5f0e8;
    --line: #e8e1d6; --line2: #d9d0c0;
    --fg: #1f1e1b; --dim: #6d6a5f; --muted: #98938a;
    --accent: #c96442; --err: #bf3c30; --warn: #8a5a00; --ok: #4d7c0f;
    --acc-weak: rgba(201,100,66,.13); --err-weak: rgba(191,60,48,.10);
    --warn-weak: rgba(138,90,0,.12); --ok-weak: rgba(77,124,15,.13);
    --bubble-me: #f5e7de; --code-bg: #f7f2e9;
    --input-bg: #ffffff; --btn-fg: #ffffff;
    --sel: #f0e9dd; --hover: rgba(80,60,30,.05);
    --mask: rgba(35,32,26,.40);
    --shadow-1: 0 1px 2px rgba(70,58,40,.06);
    --shadow-2: 0 8px 28px rgba(70,58,40,.16);
  }
  html[data-skin="claude"][data-theme="dark"] {
    color-scheme: dark;
    --bg: #1a1917; --panel: #211f1c; --panel2: #2a2723;
    --line: #332f29; --line2: #423d34;
    --fg: #f2efe9; --dim: #b0aca0; --muted: #8e8b82;
    --accent: #e08a6a; --err: #f4796b; --warn: #e3b341; --ok: #6dba6d;
    --acc-weak: rgba(224,138,106,.20); --err-weak: rgba(244,121,107,.15);
    --warn-weak: rgba(227,179,65,.14); --ok-weak: rgba(109,186,109,.17);
    --bubble-me: #2f2a24; --code-bg: #242220;
    --input-bg: #211f1c; --btn-fg: #1a1917;
    --sel: #2c2925; --hover: rgba(255,255,255,.05);
    --mask: rgba(0,0,0,.6);
    --shadow-1: 0 1px 2px rgba(0,0,0,.3);
    --shadow-2: 0 8px 28px rgba(0,0,0,.45);
  }

  /* ═══ 基础 ═══ */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.65 -apple-system, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  .mono, code, pre, .tag, .tool-name, .cb-lang { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  ::selection { background: var(--acc-weak); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .app { height: 100dvh; display: flex; flex-direction: column; }

  /* ═══ 顶栏 ═══ */
  .topbar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: relative; z-index: 5; flex: none;
  }
  .ibtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; flex: none; padding: 0;
    background: transparent; color: var(--dim);
    border: 1px solid transparent; border-radius: 9px;
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .ibtn:hover { background: var(--hover); color: var(--fg); }
  .ibtn:active { background: var(--sel); transform: translateY(1px); }
  .ibtn.sm { width: 26px; height: 26px; border-radius: 7px; }
  .tbtn {
    flex: none; padding: 6px 9px; background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 11px; font-weight: 600; letter-spacing: .06em; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tbtn:hover { background: var(--hover); color: var(--fg); }
  .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; padding: 0 2px; }
  .brand {
    font-size: 14px; font-weight: 650; letter-spacing: .01em; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  /* 主题按钮：内联 SVG，浅色显示月亮、深色显示太阳（applyTheme 不再写 emoji） */
  #theme { color: var(--fg); }
  #theme .i-sun { display: none; }
  html[data-theme="dark"] #theme .i-sun { display: block; }
  html[data-theme="dark"] #theme .i-moon { display: none; }
  .sub { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    margin-left: 2px; padding: 4px 10px 4px 9px;
    font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
  }
  .status::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; flex: none;
    background: var(--muted);
  }
  .status.ok::before { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-weak); }
  .status.busy::before { background: var(--accent); box-shadow: 0 0 0 3px var(--acc-weak); animation: pulse 1.6s ease-in-out infinite; }
  .status.err { color: var(--err); border-color: var(--err-weak); }
  .status.err::before { background: var(--err); box-shadow: 0 0 0 3px var(--err-weak); }
  .status.off { color: var(--muted); }
  @media (max-width: 390px) { .sub { max-width: 20vw; } }

  /* ═══ 会话抽屉 ═══ */
  .drawer, .sdrawer {
    position: fixed; inset: 0; z-index: 40;
    visibility: hidden; pointer-events: none;
  }
  .drawer.open, .sdrawer.open { visibility: visible; pointer-events: auto; }
  .drawer .mask, .sdrawer .mask {
    position: absolute; inset: 0; background: var(--mask);
    opacity: 0; transition: opacity .22s ease;
  }
  .drawer.open .mask, .sdrawer.open .mask { opacity: 1; }
  .drawer .panel {
    position: absolute; top: 0; bottom: 0; left: 0;
    width: min(84vw, 340px); background: var(--panel);
    border-right: 1px solid var(--line); box-shadow: var(--shadow-2);
    display: flex; flex-direction: column;
    transform: translateX(-102%);
    transition: transform .26s cubic-bezier(.32,.72,.24,1);
  }
  .drawer.open .panel { transform: none; }
  .drawer .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--line); flex: none;
  }
  .bar-t { font-size: 14px; font-weight: 650; letter-spacing: .01em; }
  .bar-n { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .grow { flex: 1; }
  .pbtn {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--accent); color: var(--btn-fg);
    border: 0; border-radius: 8px; padding: 7px 11px;
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: filter .15s, transform .1s;
  }
  .pbtn:hover { filter: brightness(1.06); }
  .pbtn:active { transform: scale(.97); }
  .searchbar {
    display: flex; align-items: center; gap: 6px; flex: none;
    margin: 10px 12px; padding: 5px 6px 5px 10px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    transition: border-color .15s;
  }
  .searchbar:focus-within { border-color: var(--accent); }
  .searchbar .s-ico { color: var(--muted); flex: none; }
  .searchbar input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg);
    font: inherit; font-size: 13.5px; padding: 4px 0;
  }
  .searchbar input:focus { outline: none; }
  .searchbar input::-webkit-search-cancel-button { display: none; }
  .drawer .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px; }
  .titem { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; }
  .titem:hover { background: var(--hover); }
  .titem:active { background: var(--sel); }
  .titem.active { background: var(--sel); }
  .titem.active::before {
    content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px;
    border-radius: 0 2px 2px 0; background: var(--accent);
  }
  .titem .trow { display: flex; align-items: center; gap: 6px; }
  .titem .tt {
    flex: 1; min-width: 0; font-size: 13.5px; font-weight: 500; line-height: 1.45;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .titem .more {
    flex: none; width: 26px; height: 26px; padding: 0;
    background: transparent; color: var(--muted);
    border: 1px solid transparent; border-radius: 7px;
    font: inherit; font-size: 14px; line-height: 1; cursor: pointer;
  }
  .titem .more:hover { background: var(--panel); border-color: var(--line2); color: var(--fg); }
  .titem .tm {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    margin-top: 4px; font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .tag {
    border: 1px solid var(--line2); border-radius: 5px; padding: 0 5px;
    font-size: 10px; line-height: 16px; color: var(--dim); letter-spacing: .03em;
  }
  .tag.busy { color: var(--warn); border-color: var(--warn-weak); background: var(--warn-weak); }
  .tag.busy.clickable { cursor: pointer; }
  .tag.busy.clickable:hover { filter: brightness(.97); }
  .tag.new { color: var(--accent); border-color: var(--acc-weak); background: var(--acc-weak); }
  .tag.idchip { color: var(--muted); cursor: pointer; letter-spacing: .02em; }
  .tag.idchip:hover { color: var(--fg); border-color: var(--line2); background: var(--hover); }
  .countrow {
    padding: 8px 14px 6px; font-size: 11.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--line);
  }
  .titem.empty { cursor: default; color: var(--muted); font-size: 12.5px; text-align: center; padding: 28px 16px; border-bottom: 0; }
  .titem.empty:hover, .titem.empty:active { background: transparent; }
  .titem .tacts { display: none; gap: 8px; margin-top: 9px; }
  .titem.menu-open .tacts { display: flex; }
  .titem .tacts button {
    font: inherit; font-size: 12px; font-weight: 500; padding: 5px 11px;
    background: transparent; color: var(--fg);
    border: 1px solid var(--line2); border-radius: 7px; cursor: pointer;
  }
  .titem .tacts button:hover { background: var(--hover); }
  .titem .tacts button.danger { color: var(--err); border-color: var(--err-weak); }
  .titem .tacts button.danger:hover { background: var(--err-weak); }

  /* ═══ 消息流 ═══ */
  .stage { position: relative; flex: 1; display: flex; min-height: 0; }
  .log {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 18px 14px 10px;
  }
  .stream { max-width: 768px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--gap); }
  .msg { display: flex; flex-direction: column; animation: rise .28s ease both; }
  .msg .meta {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px;
    font-size: 11.5px; font-variant-numeric: tabular-nums;
  }
  .msg .who { font-size: 12px; font-weight: 650; letter-spacing: .03em; color: var(--dim); }
  .msg .ts { color: var(--muted); }
  .msg.me { align-items: flex-end; }
  .msg.me .meta { flex-direction: row-reverse; }
  .bubble {
    max-width: min(88%, 560px); padding: var(--pad-bubble);
    font-size: var(--fs-body); line-height: 1.7;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.me .bubble {
    background: var(--bubble-me); border: 1px solid var(--line);
    border-radius: 14px 14px 4px 14px;
  }
  .msg.ai { align-items: stretch; }
  .msg.ai .bubble { padding: 0; max-width: none; font-size: var(--fs-body); line-height: 1.75; }
  .act {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; color: var(--muted); line-height: 1.7;
    padding: 1px 0 1px 12px; border-left: 2px solid var(--line2); margin: 1px 0 1px 2px;
  }
  .note {
    display: flex; gap: 8px; align-items: baseline;
    font-size: 12.5px; line-height: 1.6; color: var(--dim);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    overflow-wrap: anywhere;
  }
  .note.warn { color: var(--warn); border-color: var(--warn-weak); background: var(--warn-weak); }
  .note.error { color: var(--err); border-color: var(--err-weak); background: var(--err-weak); }

  /* 代码块 / 工具卡片 / 审批卡片：供后续渲染管线使用，样式先行 */
  .codeblock {
    margin: 10px 0 4px; border: 1px solid var(--line2); border-radius: 10px;
    background: var(--code-bg); overflow: hidden;
  }
  .cb-head {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .cb-lang { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .cb-copy {
    margin-left: auto; font: inherit; font-size: 11px; color: var(--dim);
    background: transparent; border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 8px; cursor: pointer;
  }
  .cb-copy:hover { background: var(--hover); color: var(--fg); }
  .codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.65; tab-size: 2; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tool {
    border: 1px solid var(--line2); border-radius: 10px; background: var(--panel);
    box-shadow: var(--shadow-1); overflow: hidden;
  }
  .tool summary {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px;
    list-style: none; cursor: pointer; user-select: none;
  }
  .tool summary::-webkit-details-marker { display: none; }
  .tool summary:hover { background: var(--hover); }
  .tool-ico { display: flex; color: var(--dim); flex: none; }
  .tool-name { font-size: 12px; font-weight: 600; letter-spacing: .02em; flex: none; }
  .tool-brief { flex: 1; min-width: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-dur { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .tstate { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; flex: none; color: var(--ok); }
  .tstate::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .tstate.run { color: var(--accent); }
  .tstate.run::before { animation: pulse 1.4s ease-in-out infinite; }
  .tstate.fail { color: var(--err); }
  .tool-fold { flex: none; display: flex; color: var(--muted); transition: transform .2s; }
  .tool[open] .tool-fold { transform: rotate(180deg); }
  .tool-body { border-top: 1px solid var(--line); }
  .tool-sec { padding: 9px 12px; }
  .tool-sec + .tool-sec { border-top: 1px solid var(--line); }
  .tool-sec-t {
    font-size: 10px; font-weight: 600; letter-spacing: .09em; color: var(--muted);
    text-transform: uppercase; margin-bottom: 6px;
  }
  .tool-sec pre {
    margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 11.5px; line-height: 1.6; overflow: auto; max-height: 180px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .approve {
    border: 1px solid var(--line2); border-left: 3px solid var(--accent);
    border-radius: 10px; background: var(--panel); box-shadow: var(--shadow-1);
    padding: 10px 12px;
  }
  .ap-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 650; letter-spacing: .02em; }
  .ap-head .tool-name { font-weight: 600; color: var(--dim); }
  .ap-cmd {
    margin: 8px 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--code-bg); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px; color: var(--dim); overflow-x: auto; white-space: pre;
  }
  .ap-note { font-size: 11.5px; color: var(--muted); margin: 0 0 8px; }
  .ap-acts { display: flex; gap: 8px; }
  .ap-acts .ok-btn { background: var(--accent); color: var(--btn-fg); border: 0; border-radius: 8px; padding: 6px 14px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .ap-acts .no-btn { background: transparent; color: var(--err); border: 1px solid var(--err-weak); border-radius: 8px; padding: 6px 14px; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .ap-acts .ok-btn:hover { filter: brightness(1.06); }
  .ap-acts .no-btn:hover { background: var(--err-weak); }

  /* ═══ 输入区 ═══ */
  .composer-wrap {
    flex: none; border-top: 1px solid var(--line); background: var(--panel);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .composer {
    max-width: 768px; margin: 0 auto;
    border: 1px solid var(--line2); border-radius: 14px;
    background: var(--input-bg); box-shadow: var(--shadow-1);
    transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--acc-weak), var(--shadow-1); }
  .runtime-controls { display:flex; align-items:center; gap:8px; padding:8px 12px 0; }
  .runtime-controls select, .runtime-controls input { min-width:0; max-width:48%; border:1px solid var(--line); border-radius:7px; padding:5px 8px; color:var(--fg); background:var(--panel); font:inherit; font-size:12px; }
  .runtime-controls input { flex:1; }
  /* 思考档改成抽屉：一排 7 个按钮在手机上太占位置（用户要求像 DSH 那样收起） */
  .rt-effort { position:relative; margin-left:auto; flex:none; }
  .rt-effort-btn {
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:var(--panel); color:var(--fg);
    border-radius:7px; padding:5px 9px; font:inherit; font-size:12px; cursor:pointer;
  }
  .rt-effort-btn:disabled { opacity:.5; cursor:default; }
  .rt-effort-key { color:var(--muted); }
  .rt-effort-cur { font-weight:600; min-width:1.6em; }
  .rt-effort-caret { color:var(--dim); transition:transform .15s; }
  .rt-effort-btn[aria-expanded="true"] .rt-effort-caret { transform:rotate(-90deg); }
  .rt-effort-menu {
    position:absolute; right:0; bottom:calc(100% + 6px); min-width:136px; padding:4px;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    box-shadow:var(--shadow-1); z-index:60;
  }
  .rt-effort-menu button {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; border:0; background:transparent; color:var(--fg);
    font:inherit; font-size:12.5px; padding:7px 10px; border-radius:6px; cursor:pointer; text-align:left;
  }
  .rt-effort-menu button:hover { background:var(--panel2); }
  .rt-effort-menu button[aria-pressed="true"] { font-weight:600; }
  .rt-effort-menu button[aria-pressed="true"]::after { content:'✓'; color:var(--accent); }
  .runtime-controls [disabled] { opacity:.5; }
  .composer textarea {
    display: block; width: 100%; border: 0; resize: none; outline: none;
    background: transparent; color: var(--fg);
    min-height: 46px; max-height: 40vh;
    padding: 12px 14px 4px;
    font: inherit; font-size: 15px; line-height: 1.6;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .cbar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px; }
  .gbtn {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; color: var(--dim);
    border: 1px solid var(--line2); border-radius: 8px;
    padding: 6px 11px; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .gbtn:not(:disabled):hover { background: var(--hover); color: var(--fg); }
  .gbtn:disabled { opacity: .45; cursor: default; }
  .hint { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .send {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; padding: 0;
    background: var(--accent); color: var(--btn-fg);
    border: 0; cursor: pointer;
    transition: filter .15s, transform .1s;
  }
  .send:hover { filter: brightness(1.08); }
  .send:active { transform: scale(.94); }
  .send:disabled { opacity: .5; cursor: default; }
  /* 窄屏藏掉快捷键提示后，.hint 的 margin-left:auto 一起消失，发送键会贴到「中断」旁边，
     这里把同样的右推补到 .send 上（不要两边都写 auto，否则剩余空间会被均分、hint 跑到中间）。 */
  @media (max-width: 380px) { .hint { display: none; } .send { margin-left: auto; } }

  /* ═══ 设置面板 ═══ */
  .sdrawer .panel {
    position: absolute; top: 0; bottom: 0; right: 0; left: auto;
    width: min(88vw, 340px); background: var(--panel);
    border-left: 1px solid var(--line); box-shadow: var(--shadow-2);
    display: flex; flex-direction: column;
    transform: translateX(102%);
    transition: transform .26s cubic-bezier(.32,.72,.24,1);
  }
  .sdrawer.open .panel { transform: none; }
  /* 这里原本只写了 border、漏 display:flex ⇒ .grow 从未参与布局，标题与关闭钮挤在左。
     补齐 flex 后回到常规：标题左、关闭右。 */
  .sdrawer .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--line); flex: none;
  }
  /* 关闭改成文字按钮：抽屉顶部只有一个孤零零的 × 太难点，文字更明确、点击区也更宽 */
  #sclose { width: auto; min-width: 34px; padding: 0 11px; font-size: 12.5px; }
  .sbody {
    flex: 1; overflow-y: auto;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 22px;
  }
  .sgroup { display: flex; flex-direction: column; }
  .sg-t {
    font-size: 10.5px; font-weight: 650; letter-spacing: .1em;
    color: var(--muted); margin-bottom: 6px;
  }
  .sg-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .sg-head .sg-t { margin-bottom: 0; }
  .cfg-ro {
    font-size: 11px; color: var(--muted); line-height: 1.7;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; overflow-wrap: anywhere; margin: 4px 0 2px;
  }
  #opt-model {
    width: 150px; max-width: 46vw; padding: 6px 9px;
    background: var(--input-bg); color: var(--fg);
    border: 1px solid var(--line2); border-radius: 8px;
    font: inherit; font-size: 12.5px; font-family: inherit;
  }
  #opt-model:focus { outline: none; border-color: var(--accent); }
  .cfg-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  #cfg-msg { font-size: 11.5px; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }
  #cfg-msg.ok { color: var(--ok); }
  #cfg-msg.err { color: var(--err); }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; }
  .srow + .srow { border-top: 1px solid var(--line); }
  .srow .lbl { font-size: 13.5px; line-height: 1.4; }
  .srow .lbl small { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .seg {
    display: flex; gap: 2px; padding: 2px; flex: none;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 9px;
  }
  .seg button {
    border: 0; background: transparent; color: var(--dim);
    font: inherit; font-size: 12px; font-weight: 500;
    padding: 5px 12px; border-radius: 7px; cursor: pointer;
    transition: color .15s;
  }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-pressed="true"] {
    background: var(--panel); color: var(--fg); font-weight: 600;
    box-shadow: var(--shadow-1); border: 1px solid var(--line);
    padding: 4px 11px;
  }
  .switch { position: relative; display: inline-flex; flex: none; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .sw {
    width: 36px; height: 21px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--line2);
    transition: background .18s, border-color .18s;
  }
  .sw::after {
    content: ""; position: absolute; top: 3.5px; left: 4px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--dim); transition: transform .18s, background .18s;
  }
  .switch input:checked + .sw { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .sw::after { transform: translateX(15px); background: #fff; }
  .switch input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sfoot { font-size: 11px; color: var(--muted); line-height: 1.7; margin: 0; }

  /* ═══ 空态 / 动效 / 响应式 ═══ */
  .empty-hero {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 30px 16px 26px; text-align: center;
  }
  .empty-hero[hidden] { display: none; }
  .eh-ico {
    width: 44px; height: 44px; border-radius: 12px; margin-bottom: 8px;
    display: grid; place-items: center; color: var(--dim);
    background: var(--panel); border: 1px solid var(--line2); box-shadow: var(--shadow-1);
  }
  .empty-hero h3 { margin: 0; font-size: 13.5px; font-weight: 650; color: var(--dim); }
  .empty-hero p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.7; max-width: 34em; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  html[data-font="s"] { --fs-body: 14px; }
  html[data-font="m"] { --fs-body: 15px; }
  html[data-font="l"] { --fs-body: 16.5px; }
  html[data-compact="1"] { --gap: 10px; --pad-bubble: 7px 11px; }
  html[data-compact="1"] .log { padding-top: 10px; }
  html[data-compact="1"] .msg .meta { margin-bottom: 3px; }
  html[data-compact="1"] .bubble { line-height: 1.55; }

  @media (min-width: 760px) {

    .log { padding: 24px 24px 12px; }
    .composer-wrap { padding: 12px 24px calc(12px + env(safe-area-inset-bottom)); }

    .msg.me .bubble { max-width: 72%; }
    .drawer .panel { width: 340px; box-shadow: none; border-right: 1px solid var(--line); }
  }
</style>
</head>

<script>
const $ = (sel) => document.querySelector(sel);
const log = $('#log');

// token 从网址取一次，之后存本地并从地址栏抹掉（免得留在浏览器历史里）
const params = new URLSearchParams(location.search);
const fromUrl = params.get('t');
if (fromUrl) {
  localStorage.setItem('bridge_token', fromUrl);
  params.delete('t');
  const rest = params.toString();
  history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
}
const TOKEN = localStorage.getItem('bridge_token') || '';

// ── 引擎身份（P5.1，2026-10-29 阶段 B）───────────────────────────────
// 页面由两套桥共用（Codex 桥 bridge/web/server.mjs:36 默认 3095 / Pi 桥 bridge/pi/server.mjs:22 默认 8788，
// Pi 桥直接复用本文件：bridge/pi/server.mjs:129-151），所以不能把 AI 署名写死成 Codex。
// 取值一律**不推断**：
//   1) GET /api/health —— 两桥都有：Codex server.mjs:671（该端点在 token 门禁 server.mjs:699 之前，
//      无需 token；但响应里**没有** engine 字段，所以它只能当连通性兜底）、Pi server.mjs:122（带 engine:'pi'）；
//   2) GET /api/config —— 只有 Pi 桥带 engine（server.mjs:171-173）；Codex 桥的 /api/config 是 config.toml
//      字段集（server.mjs:515-524，无 engine）且文件缺失时 500（handleGetConfig:503-509），不能当唯一来源。
// 兜底 'Codex'：拿不到身份时维持改造前行为（v1 任务书 §7.2 口径），不猜成 Pi。
// ⚠️ 这里的 'codex' 是**引擎标识**，与 data-skin=codex/claude 那套配色皮肤名无关（红线：皮肤名不改）。
let engineId = '';
let engineName = 'Codex';
const ENGINE_LABELS = { codex: 'Codex', pi: 'Pi' };
const engineHeaders = () => ({ 'x-bridge-token': TOKEN });

function applyEngineIdentity() {
  document.querySelectorAll('.engine-name').forEach((node) => { node.textContent = engineName; });
}

// 只认服务端明说的 engine 字段；两个端点都没给 → 保持 Codex 兜底。
function noteEngineIdentity(raw) {
  const id = String((raw && raw.engine) || '').toLowerCase();
  if (id !== 'pi' && id !== 'codex') return;
  if (id === engineId) return;
  engineId = id;
  engineName = ENGINE_LABELS[id] || 'Codex';
  applyEngineIdentity();
}

async function loadEngineIdentity() {
  if (!TOKEN) return;   // 无 token 时请求只会被 401，白刷一次控制台
  const attempts = [
    () => fetch('/api/health', { headers: engineHeaders() }),
    () => fetch('/api/config', { headers: engineHeaders() }),
  ];
  for (const attempt of attempts) {
    try {
      const resp = await attempt();
      const raw = await resp.json().catch(() => null);
      if (resp.ok && raw && raw.engine !== undefined) { noteEngineIdentity(raw); return; }
    } catch { /* 桥未起 / 网络异常：下一个端点，最后落到 Codex 兜底 */ }
  }
}

let threadId = localStorage.getItem('bridge_thread') || null;
let controller = null;
let lastBubble = null;
let ended = false;
let lastUsage = null;
let pendingTitle = null;
const seenNotes = new Set();

// ── 会话与历史 ───────────────────────────────────────────────────────────────
// 每个对话一份历史，存在 localStorage；服务端各自是一个 codex thread。
const DRAFT = 'draft';
let threads = [];
let threadQuery = '';                 // 会话列表的本地过滤词（纯前端，不发请求）
let currentTitle = '';
let currentBusy = false;
let stamp = '';

const logKey = (id) => `bridge_log_${id || DRAFT}`;
function loadEntries(id) {
  try { return JSON.parse(localStorage.getItem(logKey(id)) || '[]'); } catch { return []; }
}
function storeEntries(list) {
  const kept = list.slice(-80);
  try { localStorage.setItem(logKey(threadId), JSON.stringify(kept)); } catch {}
  return kept;
}

let entries = [];
function saveEntries() { entries = storeEntries(entries); }
function pushEntry(entry) { entries.push(entry); saveEntries(); }

// 旧版只有一个 bridge_log，迁到当前会话名下，别把已有的对话弄丢
(function migrateLegacyLog() {
  const legacy = localStorage.getItem('bridge_log');
  if (!legacy) return;
  if (!localStorage.getItem(logKey(threadId))) localStorage.setItem(logKey(threadId), legacy);
  localStorage.removeItem('bridge_log');
})();

function upsertThread(id, title) {
  const hit = threads.find((t) => t.id === id);
  if (hit) { if (title) hit.title = title; }
  else threads.unshift({ id, title: title || '（无标题）', source: 'bridge', updatedAt: new Date().toISOString() });
  if (title) setSubtitle(title);
  renderConvoList();
}

function setSubtitle(text) {
  currentTitle = text || '';
  $('#subtitle').textContent = currentTitle;
}

function drawer(open) { $('#drawer').classList.toggle('open', open); }

// 搜索框匹配：标题或完整会话 ID 含关键词即可（大小写不敏感）
function matchesQuery(t, q) {
  return String(t.title || '').toLowerCase().includes(q) || String(t.id || '').toLowerCase().includes(q);
}

function when(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const pad = (n) => String(n).padStart(2, '0');
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return `今天 ${hm}`;
  if (d.toDateString() === new Date(now.getTime() - 86400000).toDateString()) return `昨天 ${hm}`;
  return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}

// 会话列表来自服务端（也就是 codex 自己的会话存储），所以终端里聊过的也能在网页里切
async function loadThreads() {
  if (!TOKEN) return;
  try {
    const resp = await fetch('/api/threads?limit=80', { headers: { 'x-bridge-token': TOKEN } });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || resp.statusText);
    threads = data.threads || [];
  } catch (err) {
    setStatus('会话列表读取失败');
    return;
  }
  renderConvoList();
  currentBusy = Boolean(threads.find((t) => t.id === threadId)?.busy);
  if (threadId && !currentTitle) {
    const hit = threads.find((t) => t.id === threadId);
    if (hit) setSubtitle(hit.title);
  }
}

function renderConvoList() {
  const list = $('#tlist');
  list.innerHTML = '';
  if (!threads.length) {
    list.appendChild(el('div', 'titem empty', '（还没有会话记录）'));
    return;
  }
  const q = threadQuery.trim().toLowerCase();
  const shown = q ? threads.filter((t) => matchesQuery(t, q)) : threads;
  if (q) list.appendChild(el('div', 'countrow', `${shown.length} / ${threads.length} 条匹配`));
  if (!shown.length) {
    list.appendChild(el('div', 'titem empty', '没有匹配的会话（换关键词或点 ✕ 清空）'));
    return;
  }
  for (const t of shown) {
    const item = el('div', 'titem' + (t.id === threadId ? ' active' : ''));
    const row = el('div', 'trow');
    row.appendChild(el('div', 'tt', t.title || '（无标题）'));
    const more = el('button', 'more', '⋯');
    more.title = '更多操作';
    more.addEventListener('click', (ev) => { ev.stopPropagation(); item.classList.toggle('menu-open'); });
    row.appendChild(more);
    item.appendChild(row);
    const meta = el('div', 'tm');
    meta.appendChild(el('span', 'tag', t.source === 'bridge' ? '网页' : '终端'));
    meta.appendChild(el('span', null, when(t.updatedAt)));
    if (t.busy) {
      // 点一下问服务端：到底是谁占着（旧版只说"另一个终端"，等于没说）
      const busyTag = el('span', 'tag busy clickable', '占用中');
      busyTag.title = '点击查看是谁占着这条会话';
      busyTag.addEventListener('click', (ev) => { ev.stopPropagation(); checkLockOwner(t.id); });
      meta.appendChild(busyTag);
    }
    if (t.pending) meta.appendChild(el('span', 'tag new', '未开始'));
    // 会话 ID 芯片：点一下复制完整 id
    const shortId = String(t.id || '').slice(0, 8);
    const idChip = el('span', 'tag idchip', shortId);
    // 提示按引擎（P5.1）：codex-env -a <id> 只对 Codex 有意义，Pi 桥下不提示这个命令
    // （Pi 侧的会话管理命令本包未提供，宁可不提示，不编造）。
    idChip.title = engineId === 'pi'
      ? '点击复制完整会话 ID：' + t.id
      : '点击复制完整会话 ID（终端里 codex-env -a <id> 要用）：' + t.id;
    idChip.addEventListener('click', (ev) => {
      ev.stopPropagation();
      copyText(t.id, () => {
        idChip.textContent = '已复制';
        setTimeout(() => { idChip.textContent = shortId; }, 1200);
      });
    });
    meta.appendChild(idChip);
    item.appendChild(meta);
    item.title = t.id;

    const acts = el('div', 'tacts');
    const arch = el('button', 'ghost', '归档');
    arch.addEventListener('click', (ev) => { ev.stopPropagation(); threadAction('archive', t); });
    const del = el('button', 'ghost danger', '删除');
    del.addEventListener('click', (ev) => { ev.stopPropagation(); threadAction('delete', t); });
    acts.append(arch, del);
    item.appendChild(acts);

    item.addEventListener('click', () => openThread(t.id));
    list.appendChild(item);
  }
}

function replay() {
  log.innerHTML = '';
  seenNotes.clear();
  lastBubble = null;
  for (const entry of entries) {
    if (entry.t === 'me' || entry.t === 'ai') addMessage(entry.t, entry.text, true);
    else if (entry.t === 'act') addActivity(entry.name, entry.detail, true);
    else if (entry.t === 'note') addNote(entry.text, entry.level, true);
  }
  if (entries.length) scroll(true);
}

async function openThread(id) {
  if (controller) { addNote('正在跑一轮，先等它结束或点「中断」', 'warn'); return; }
  drawer(false);
  saveEntries();                       // 先把当前这份存好
  threadId = id;
  loadRuntimeSettings();
  localStorage.setItem('bridge_thread', id);
  const hit = threads.find((t) => t.id === id);
  setSubtitle(hit ? hit.title : '');
  currentBusy = Boolean(hit?.busy);
  log.innerHTML = '';
  seenNotes.clear();
  lastBubble = null;
  setStatus('载入中…');
  try {
    const resp = await fetch(`/api/transcript?id=${encodeURIComponent(id)}`, { headers: { 'x-bridge-token': TOKEN } });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || resp.statusText);
    entries = data.entries || [];
    replay();
    const s = await (await fetch(`/api/stamp?id=${encodeURIComponent(id)}`, { headers: { 'x-bridge-token': TOKEN } })).json().catch(() => ({}));
    stamp = s.stamp || '';
    setStatus(entries.length ? `已载入 ${entries.length} 条` : '这条会话没有文本记录');
    if (currentBusy) {
      // 别只说"被占用"就完事：把真正的锁持有者查出来，用户才知道该去关谁
      noteFresh('这条会话在 app-server 里还是 active：可以看，但在这里发消息会被拦住。正在查是谁占着写锁…', 'warn');
      checkLockOwner(id);
    }
    else if (hit?.pending) addNote('这是终端刚开、还没说话的新会话：它还没落盘，网页暂时接管不了。去终端里说一句，之后两边都能发。', 'warn');
  } catch (err) {
    addNote(`载入失败：${err.message}`, 'error');
  }
  renderConvoList();
}

function newThread() {
  if (controller) { addNote('正在跑一轮，先点「中断」再开新会话', 'warn'); return; }
  drawer(false);
  saveEntries();
  threadId = null;
  localStorage.removeItem('bridge_thread');
  entries = [];
  log.innerHTML = '';
  seenNotes.clear();
  lastBubble = null;
  setSubtitle('');
  currentBusy = false;
  stamp = '';
  renderConvoList();
  setStatus('新会话');
  $('#input').focus();
}

function setStatus(text) { $('#status').textContent = text; }

const runtimeModel = $('#runtime-model');
const runtimeEffortBtn = $('#runtime-effort-btn');
const runtimeEffortMenu = $('#runtime-effort-menu');
const runtimeEffortCur = $('#runtime-effort-cur');
let runtimeSettingsBusy = false;
const EFFORT_LABELS = { off:'关', minimal:'最少', low:'低', medium:'中', high:'高', xhigh:'极高', max:'最大' };

function closeEffortMenu() {
  runtimeEffortMenu.hidden = true;
  runtimeEffortBtn.setAttribute('aria-expanded', 'false');
}

// 思考档做成抽屉：一排 7 个按钮在手机上要占两行（用户要求改成像 DSH 那样点击展开）
function renderEffortLevels(levels, selected) {
  const list = Array.isArray(levels) ? levels : [];
  runtimeEffortMenu.replaceChildren();
  for (const level of list) {
    const b = el('button', '', EFFORT_LABELS[level] || level);
    b.type = 'button';
    b.dataset.v = level;
    b.setAttribute('aria-pressed', String(level === selected));
    b.addEventListener('click', () => { closeEffortMenu(); updateRuntimeSettings({ effort: level }); });
    runtimeEffortMenu.appendChild(b);
  }
  runtimeEffortCur.textContent = selected ? (EFFORT_LABELS[selected] || selected) : '—';
  runtimeEffortBtn.disabled = list.length === 0;
  if (list.length === 0) closeEffortMenu();
}

runtimeEffortBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const willOpen = runtimeEffortMenu.hidden;
  runtimeEffortMenu.hidden = !willOpen;
  runtimeEffortBtn.setAttribute('aria-expanded', String(willOpen));
});
document.addEventListener('click', () => closeEffortMenu());
async function loadRuntimeSettings() {
  const id = threadId;
  runtimeModel.disabled = !id || !!controller;
  runtimeEffortBtn.disabled = !id || !!controller;
  if (!id || !TOKEN) { renderEffortLevels([], ''); return; }
  try {
    const r = await fetch(`/api/runtime-settings?threadId=${encodeURIComponent(id)}`, { headers: { 'x-bridge-token': TOKEN } });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    if (id !== threadId) return;
    // 模型选择器改成真正的下拉（用户要求「直接拉取替换」，不要打字）
    const models = Array.isArray(data.models) ? data.models.slice() : [];
    if (data.model && !models.includes(data.model)) models.unshift(data.model);
    runtimeModel.replaceChildren();
    if (models.length === 0) {
      const o = document.createElement('option');
      o.value = ''; o.textContent = data.model || '（无可选模型）';
      runtimeModel.appendChild(o);
      runtimeModel.disabled = true;
    } else {
      for (const m of models) {
        const o = document.createElement('option');
        o.value = m; o.textContent = m;
        runtimeModel.appendChild(o);
      }
      runtimeModel.value = data.model && models.includes(data.model) ? data.model : models[0];
      runtimeModel.disabled = !!controller;
    }
    renderEffortLevels(data.levels || [], data.effort || '');
    runtimeEffortBtn.disabled = !(data.levels || []).length || !!controller;
  } catch (err) {
    if (id === threadId) setStatus(`设置读取失败：${err.message}`);
  }
}
async function updateRuntimeSettings(patch) {
  if (!threadId || runtimeSettingsBusy) return;
  const id = threadId;
  runtimeSettingsBusy = true;
  runtimeModel.disabled = true;
  runtimeEffortBtn.disabled = true;
  closeEffortMenu();
  setStatus('切换中…');
  try {
    const r = await fetch('/api/runtime-settings', {
      method: 'POST', headers: { 'content-type': 'application/json', 'x-bridge-token': TOKEN },
      body: JSON.stringify({ threadId: id, ...patch }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    setStatus('当前会话设置已切换');
    await loadRuntimeSettings();
  } catch (err) {
    setStatus(`切换失败：${err.message}`);
    await loadRuntimeSettings();
  } finally {
    runtimeSettingsBusy = false;
  }
}
runtimeModel.addEventListener('change', () => {
  const model = runtimeModel.value.trim();
  if (model) updateRuntimeSettings({ model });
});

// 归档 / 删除：走服务端的 codex 命令，删之前一定问一次
async function threadAction(kind, t) {
  const label = kind === 'delete' ? '永久删除' : '归档';
  const detail = kind === 'delete'
    ? '记录会从磁盘上删掉，不能恢复。'
    : '归档后从列表消失，文件挪进 archived_sessions。';
  if (!confirm(`${label}「${t.title || '（无标题）'}」？\n${detail}`)) return;
  setStatus(kind === 'delete' ? '删除中…' : '归档中…');
  try {
    const resp = await fetch(`/api/thread/${kind}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-bridge-token': TOKEN },
      body: JSON.stringify({ id: t.id }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      // 409 时服务端会带上锁持有者，一并显示出来（否则用户不知道该关哪个进程）
      throw new Error([data.error, data.holder?.hint].filter(Boolean).join(' ') || resp.statusText);
    }
    if (t.id === threadId) newThread();
    await loadThreads();
    setStatus(kind === 'delete' ? '已删除' : '已归档');
  } catch (err) {
    addNote(`${label}失败：${err.message}`, 'error');
  }
}

// 同步：终端那边在这条会话里说了话，网页按一下（或每 5 秒自动）就能跟上
async function syncNow(quiet) {
  if (!threadId || controller) return;
  try {
    const s = await (await fetch(`/api/stamp?id=${encodeURIComponent(threadId)}`, { headers: { 'x-bridge-token': TOKEN } })).json();
    if (!s.stamp) return;
    if (s.stamp === stamp) {
      if (!quiet) setStatus('已是最新');
      return;
    }
    const resp = await fetch(`/api/transcript?id=${encodeURIComponent(threadId)}`, { headers: { 'x-bridge-token': TOKEN } });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || resp.statusText);
    stamp = s.stamp;
    entries = data.entries || [];
    replay();
    setStatus(`已同步 ${entries.length} 条`);
  } catch (err) {
    if (!quiet) addNote(`同步失败：${err.message}`, 'error');
  }
}

function copyText(text, done) {
  const ok = () => { try { done(); } catch {} };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(() => fallback());
  } else { fallback(); }
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); ok(); } catch {}
    document.body.removeChild(ta);
  }
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function nearBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 120; }
function scroll(force) { if (force || nearBottom()) log.scrollTop = log.scrollHeight; }

function addMessage(who, text, restore) {
  const box = el('div', 'msg ' + who);
  // 署名跟引擎走（P5.1）：原来写死 'Codex'，Pi 桥（8788）复用同一页面时会把 Pi 答成 Codex。
  box.appendChild(el('div', 'who', who === 'me' ? '你' : engineName));
  const bubble = el('div', 'bubble', text);
  box.appendChild(bubble);
  log.appendChild(box);
  lastBubble = who === 'ai' ? bubble : null;
  if (!restore) pushEntry({ t: who, text });
  scroll(true);
  return bubble;
}

function addAgentChunk(text) {
  if (!lastBubble) lastBubble = addMessage('ai', '');
  lastBubble.textContent += text;
  const last = entries[entries.length - 1];
  if (last && last.t === 'ai') { last.text = lastBubble.textContent; saveEntries(); }
  scroll(false);
}

function addActivity(name, detail, restore) {
  const line = el('div', 'act', '· ' + name + (detail ? '：' + detail : ''));
  log.appendChild(line);
  lastBubble = null;
  if (!restore) pushEntry({ t: 'act', name, detail });
  scroll(false);
}

function addNote(text, level, restore) {
  if (seenNotes.has(text)) return;      // 同一条提示只显示一次（例如每轮都会冒出来的元数据告警）
  seenNotes.add(text);
  log.appendChild(el('div', 'note ' + (level || ''), '⚠ ' + text));
  lastBubble = null;
  if (!restore) pushEntry({ t: 'note', text, level: level || '' });
  scroll(false);
}

// 需要重复出现的提示（每次点都该看到）绕开 seenNotes 去重
function noteFresh(text, level) {
  seenNotes.delete(text);
  addNote(text, level);
}

// 问服务端：这条会话的写锁在谁手里（扫 /proc，按需调用，不进列表轮询）
async function checkLockOwner(id) {
  setStatus('查占用中…');
  let info = null;
  try {
    const resp = await fetch(`/api/lock-info?id=${encodeURIComponent(id)}`, { headers: { 'x-bridge-token': TOKEN } });
    info = await resp.json();
    if (!resp.ok) throw new Error(info.error || resp.statusText);
  } catch (err) {
    noteFresh(`查占用失败：${err.message || err}`, 'error');
    setStatus('查占用失败');
    return;
  }
  if (!info.held) {
    noteFresh('没查到写锁持有者（锁文件不存在）：多半是 app-server 里的状态残留，刷新列表或稍后再试。', 'warn');
    setStatus('无锁持有者');
    return;
  }
  noteFresh(info.hint || '锁被占着，但没拿到细节', info.selfOnly ? 'warn' : 'error');
  for (const h of info.holders || []) {
    if (!h.isUpstream) noteFresh(`  占用进程 pid ${h.pid}（${h.comm || '?'}）：${h.cmdline || '（读不到命令行）'}`, 'error');
  }
  setStatus(info.selfOnly ? '锁在上游 app-server' : '锁在别的进程');
}

async function send() {
  const input = $('#input');
  const text = input.value.trim();
  if (!text) return;
  if (!TOKEN) { addNote('没有 token：请用启动时打印的完整网址打开本页', 'error'); return; }
  if (threadId && currentBusy) {
    setStatus('会话被占用');
    noteFresh('这条会话在 app-server 里还是 active，发不出去。正在查是谁占着写锁…', 'warn');
    checkLockOwner(threadId);
    return;
  }

  addMessage('me', text);
  input.value = '';
  input.style.height = 'auto';
  $('#send').disabled = true;
  $('#stop').disabled = false;
  setStatus('运行中…');
  const t0 = Date.now();
  ended = false;
  const tick = setInterval(() => {
    if (!ended) setStatus(`运行中 ${Math.round((Date.now() - t0) / 1000)}s`);
  }, 500);

  controller = new AbortController();
  const startingFresh = !threadId;
  if (startingFresh) pendingTitle = text.slice(0, 24);
  try {
    const resp = await fetch('/api/send', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-bridge-token': TOKEN },
      body: JSON.stringify({ text, threadId }),
      signal: controller.signal,
    });

    if (!resp.ok) {
      let detail = resp.statusText;
      try { detail = (await resp.json()).error || detail; } catch {}
      addNote(detail, 'error');
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.trim()) continue;
        let ev;
        try { ev = JSON.parse(line); } catch { continue; }
        if (ev.kind === 'meta') {
          const wasDraft = !threadId;
          threadId = ev.threadId;
          currentBusy = false;
          localStorage.setItem('bridge_thread', threadId);
          if (wasDraft) { try { localStorage.removeItem(logKey(DRAFT)); } catch {} }
          upsertThread(threadId, pendingTitle);
          saveEntries();
        } else if (ev.kind === 'text') {
          addAgentChunk(ev.text);
        } else if (ev.kind === 'activity') {
          addActivity(ev.name, ev.detail);
        } else if (ev.kind === 'note') {
          // 「模型元数据缺失」是已知的无害告警，降级成黄色，别当成错误
          const known = ev.text.startsWith('Model metadata for');
          addNote(ev.text, known ? 'warn' : ev.level);
        } else if (ev.kind === 'end') {
          ended = true;
          lastUsage = ev.usage || null;
        } else if (ev.kind === 'done') {
          const tokens = lastUsage && lastUsage.output_tokens ? ` · 输出 ${lastUsage.output_tokens} tok` : '';
          const failed = ev.ok === false ? ' · 有错误' : '';
          setStatus(`完成 ${(ev.ms / 1000).toFixed(1)}s${tokens}${failed}`);
          loadThreads();          // 标题/时间在服务端才权威，这轮结束后对一次表
        }
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') addNote('已中断', 'warn');
    else addNote(String(err.message || err), 'error');
  } finally {
    clearInterval(tick);
    controller = null;
    $('#send').disabled = false;
    $('#stop').disabled = true;
    loadRuntimeSettings();
    if ($('#status').textContent.startsWith('运行中')) setStatus('结束');
    lastBubble = null;
  }
}

async function stop() {
  // abort 放在前面：它只作用于绑了 controller.signal 的 /api/send 流（见 send()），
  // 不会取消下面的停止请求；先 abort 让 UI 立刻有反馈，不必干等最长 15s 的 interrupt RPC。
  if (controller) controller.abort();
  let state = '';
  try {
    const r = await fetch('/api/stop', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-bridge-token': TOKEN },
      body: JSON.stringify(threadId ? { threadId } : {}),
    });
    const d = await r.json().catch(() => ({}));
    state = d.state || '';
    if (state === 'none') addNote('没有正在跑的回合', 'warn');
    else if (state === 'pending') addNote('回合还在启动，已登记取消：它一起来就会被停', 'warn');
    else if (state === 'stopped') addNote('已中断');
    else if (state === 'failed') addNote('中断已发出，但上游未确认；若仍在跑请再点一次', 'warn');
    else if (state === 'ambiguous') addNote(d.error || '有多个活跃回合，无法确定停哪个', 'error');
    else if (!r.ok) addNote(d.error || ('中断失败：HTTP ' + r.status), 'error');
  } catch (err) {
    addNote('中断失败：' + String(err.message || err), 'error');
  }
}

$('#send').addEventListener('click', send);
$('#stop').addEventListener('click', stop);

// 界面风格：codex（默认）/ claude 两套皮肤；两套各自带浅深两档，所以白夜切换照旧保留
const SKIN_KEY = 'bridge_skin';
const THEME_KEY = 'bridge_theme';
function applySkin(s) {
  const claude = s === 'claude';
  document.documentElement.setAttribute('data-skin', claude ? 'claude' : 'codex');
  const btn = $('#skin');
  btn.textContent = claude ? 'CL' : 'CX';
  btn.title = claude ? '当前：Claude 风（点一下换 Codex 风）' : '当前：Codex 风（点一下换 Claude 风）';
}
// 主题：浅色默认，点一下切深色，选择记在 localStorage（重开还是你选的那个）
// 图标（月亮/太阳）由 CSS 按 html[data-theme] 切换，这里不再写 emoji（无 emoji 字体的环境会变豆腐块）
function applyTheme(t) {
  const dark = t === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const btn = $('#theme');
  btn.title = dark ? '切到浅色' : '切到深色';
  btn.setAttribute('aria-label', btn.title);
}
let skin = localStorage.getItem(SKIN_KEY) === 'claude' ? 'claude' : 'codex';
let theme = localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light';
applySkin(skin);
applyTheme(theme);
$('#skin').addEventListener('click', () => {
  skin = skin === 'claude' ? 'codex' : 'claude';
  try { localStorage.setItem(SKIN_KEY, skin); } catch {}
  applySkin(skin);
});
$('#theme').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, theme); } catch {}
  applyTheme(theme);
});
$('#menu').addEventListener('click', () => drawer(true));
$('#mask').addEventListener('click', () => drawer(false));
$('#refresh').addEventListener('click', () => loadThreads());
$('#newconv').addEventListener('click', newThread);
$('#sync').addEventListener('click', () => syncNow(false));

// 会话列表检索：纯前端过滤，Ctrl+K / Cmd+K 唤起并聚焦（PC 桌面用）
const tsearch = $('#tsearch');
function setQuery(v) {
  threadQuery = v;
  tsearch.value = v;
  renderConvoList();
}
tsearch.addEventListener('input', () => { threadQuery = tsearch.value; renderConvoList(); });
tsearch.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { ev.preventDefault(); setQuery(''); }
  if (ev.key === 'Enter') { ev.preventDefault(); $('#tlist').querySelector('.titem:not(.empty)')?.click(); }
});
$('#tclear').addEventListener('click', () => { setQuery(''); tsearch.focus(); });
document.addEventListener('keydown', (ev) => {
  if (!(ev.ctrlKey || ev.metaKey) || ev.altKey || ev.key.toLowerCase() !== 'k') return;
  ev.preventDefault();
  drawer(true);
  tsearch.focus();
  tsearch.select();
});
// 开着页面时每 5 秒对一次版本戳（只 stat 文件，很便宜）
setInterval(() => {
  if (document.visibilityState !== 'visible' || controller) return;
  if (threadId) syncNow(true);
  loadThreads();   // 终端里新开的会话、别处结束的回合，都会自己出现在列表里
}, 5000);

const input = $('#input');
input.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    send();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + 'px';
});

entries = loadEntries(threadId);
replay();
renderConvoList();
loadThreads();
loadRuntimeSettings();
// 引擎身份取到后：重画静态署名，并把已经渲染出来的气泡署名一并纠正
// （replay() 在身份回来前就跑完了，不补这一步，历史消息会停在兜底的 Codex 上）。
loadEngineIdentity().then(() => {
  log.querySelectorAll('.msg.ai > .who').forEach((node) => { node.textContent = engineName; });
});

if (!TOKEN) addNote('没有 token：请用启动时打印的完整网址打开本页', 'error');
else setStatus(threadId ? '已接上一轮对话' : '就绪');
</script>

<script>
/* ═══ 新 UI 的增量脚本：只做展示层适配，不动上面的业务逻辑 ═══
   1. #status 状态灯：setStatus() 只写文本，这里用 MutationObserver 按关键词补状态 class；
   2. 空会话占位：#log 被清空时显示 empty-hero；
   3. 设置面板：皮肤/主题沿用上面的 applySkin/applyTheme 与 bridge_skin/bridge_theme 键；
      字号 bridge_font、紧凑 bridge_compact、自动滚动 bridge_autoscroll 均为新增 localStorage 键；
   4. 自动滚动关闭时，包一层 scroll()（原函数保留，绑定在运行时可覆盖）。 */
(function () {
  const root = document.documentElement;

  // 1) 状态灯
  const st = $('#status');
  function statusClass(text) {
    if (/运行中|载入中|删除中|归档中|查占用/.test(text)) return 'busy';
    if (/失败|错误|断开/.test(text)) return 'err';
    return 'ok';
  }
  function syncStatus() {
    const cls = statusClass(st.textContent || '');
    st.classList.remove('ok', 'busy', 'err', 'off');
    st.classList.add(cls);
  }
  new MutationObserver(syncStatus).observe(st, { childList: true, characterData: true, subtree: true });
  syncStatus();

  // 2) 空态占位。hero 已移到 #log 外面（log.innerHTML='' 清不到它），
  //    但仍每次现查 + 空值兜底：将来谁再把 hero 挪回 #log，也不许炸掉整个 IIFE。
  function syncEmpty() {
    const hero = $('#emptyhero');
    if (!hero) return;
    hero.hidden = Boolean(log.querySelector('.msg, .act, .note'));
  }
  new MutationObserver(syncEmpty).observe(log, { childList: true, subtree: true });
  syncEmpty();

  // 3) 设置面板
  function openSettings(v) { $('#sdrawer').classList.toggle('open', v); }
  $('#settings').addEventListener('click', () => openSettings(true));
  $('#sclose').addEventListener('click', () => openSettings(false));
  document.querySelector('.smask').addEventListener('click', () => openSettings(false));
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { openSettings(false); } });

  function segSync(id, val) {
    document.querySelectorAll('#' + id + ' button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === val)));
  }
  document.getElementById('seg-skin').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    try { localStorage.setItem('bridge_skin', b.dataset.v); } catch {}
    applySkin(b.dataset.v);
  });
  document.getElementById('seg-theme').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    try { localStorage.setItem('bridge_theme', b.dataset.v); } catch {}
    applyTheme(b.dataset.v);
  });
  // 顶栏 CX/🌙 按钮切换时，设置面板的分段控件跟着亮（观察 html 属性最稳）
  new MutationObserver(() => {
    segSync('seg-skin', root.getAttribute('data-skin') || 'codex');
    segSync('seg-theme', root.getAttribute('data-theme') || 'light');
  }).observe(root, { attributes: true, attributeFilter: ['data-skin', 'data-theme'] });
  segSync('seg-skin', root.getAttribute('data-skin') || 'codex');
  segSync('seg-theme', root.getAttribute('data-theme') || 'light');

  const FONT_KEY = 'bridge_font', COMPACT_KEY = 'bridge_compact', AUTOSCROLL_KEY = 'bridge_autoscroll';
  const f0 = localStorage.getItem(FONT_KEY) || 'm';
  root.setAttribute('data-font', f0); segSync('seg-font', f0);
  document.getElementById('seg-font').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    root.setAttribute('data-font', b.dataset.v); segSync('seg-font', b.dataset.v);
    try { localStorage.setItem(FONT_KEY, b.dataset.v); } catch {}
  });

  const compactInput = document.getElementById('opt-compact');
  if (localStorage.getItem(COMPACT_KEY) === '1') { root.setAttribute('data-compact', '1'); compactInput.checked = true; }
  compactInput.addEventListener('change', () => {
    root.setAttribute('data-compact', compactInput.checked ? '1' : '0');
    try { localStorage.setItem(COMPACT_KEY, compactInput.checked ? '1' : '0'); } catch {}
  });

  // 4) 自动滚动开关：关掉后普通滚动跟随不再发生，强制滚动（切会话/重放）保留
  const autoInput = document.getElementById('opt-autoscroll');
  let AUTOSCROLL = localStorage.getItem(AUTOSCROLL_KEY) !== '0';
  autoInput.checked = AUTOSCROLL;
  autoInput.addEventListener('change', () => {
    AUTOSCROLL = autoInput.checked;
    try { localStorage.setItem(AUTOSCROLL_KEY, AUTOSCROLL ? '1' : '0'); } catch {}
  });
  const origScroll = scroll;
  scroll = function (force) { if (!AUTOSCROLL && !force) return; origScroll(force); };

})();
</script>
</body>
</html>
